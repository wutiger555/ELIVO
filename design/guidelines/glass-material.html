<!-- @dsCard group="Spacing" viewport="700x240" name="Liquid glass" subtitle="Translucent fill + 24–40px blur + specular top edge, over ambient light" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-4)}</style></head><body><div style="position:relative;height:192px;border-radius:22px;overflow:hidden;background:var(--void-0)">
<div style="position:absolute;width:220px;height:220px;left:30px;top:-40px;border-radius:50%;background:var(--ion-500);filter:blur(50px);opacity:.55"></div>
<div style="position:absolute;width:200px;height:200px;right:40px;bottom:-80px;border-radius:50%;background:var(--ember-500);filter:blur(50px);opacity:.45"></div>
<div style="position:absolute;width:160px;height:160px;left:320px;top:10px;border-radius:50%;background:var(--cryo-500);filter:blur(50px);opacity:.35"></div>
<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px">
<div style="border-radius:22px;background:var(--glass-fill-thin);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;flex-direction:column;justify-content:flex-end;padding:16px"><div class="m" style="color:var(--text-1)">thin</div><div class="v" style="margin-top:6px;color:var(--text-2)">--glass-fill-thin</div></div><div style="border-radius:22px;background:var(--glass-fill);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;flex-direction:column;justify-content:flex-end;padding:16px"><div class="m" style="color:var(--text-1)">regular</div><div class="v" style="margin-top:6px;color:var(--text-2)">--glass-fill</div></div><div style="border-radius:22px;background:var(--glass-fill-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);display:flex;flex-direction:column;justify-content:flex-end;padding:16px"><div class="m" style="color:var(--text-1)">strong</div><div class="v" style="margin-top:6px;color:var(--text-2)">--glass-fill-strong</div></div>
</div></div></body></html>
