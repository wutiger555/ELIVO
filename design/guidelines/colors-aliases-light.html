<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-4)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="height:44px;border-radius:12px;background:var(--bg);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;align-items:flex-end;padding:6px 10px" class="m">bg</div><div style="height:44px;border-radius:12px;background:var(--surface-1);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;align-items:flex-end;padding:6px 10px" class="m">surface-1</div><div style="height:44px;border-radius:12px;background:var(--surface-2);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;align-items:flex-end;padding:6px 10px" class="m">surface-2</div><div style="height:44px;border-radius:12px;background:var(--glass-fill);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge);display:flex;align-items:flex-end;padding:6px 10px" class="m">glass-fill</div></div><div style="display:flex;gap:18px;margin-top:14px;align-items:center"><span style="color:var(--text-1)">text-1</span><span style="color:var(--text-2)">text-2</span><span style="color:var(--text-3)">text-3</span><span style="color:var(--text-4)">text-4</span><span style="color:var(--accent-text)">accent-text</span><span style="background:var(--accent);color:var(--accent-fg);padding:6px 14px;border-radius:99px;font-weight:500">accent / accent-fg</span></div></body></html>
