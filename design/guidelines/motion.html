<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="ease-out · spring for press/thumbs · 120 / 220 / 340 / 480ms · cards surface with rise + blur-in" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-4)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="padding:14px;border-radius:18px;background:var(--glass-fill);box-shadow:var(--glass-edge);animation:elivo-surface 120ms var(--ease-out) 0ms both infinite alternate"><div class="m" style="color:var(--text-1)">fast</div><div class="v" style="margin-top:6px">120ms</div><div style="font-size:12px;color:var(--text-3);margin-top:4px">hover, color</div></div><div style="padding:14px;border-radius:18px;background:var(--glass-fill);box-shadow:var(--glass-edge);animation:elivo-surface 200ms var(--ease-out) 300ms both infinite alternate"><div class="m" style="color:var(--text-1)">base</div><div class="v" style="margin-top:6px">200ms</div><div style="font-size:12px;color:var(--text-3);margin-top:4px">toggles</div></div><div style="padding:14px;border-radius:18px;background:var(--glass-fill);box-shadow:var(--glass-edge);animation:elivo-surface 320ms var(--ease-out) 600ms both infinite alternate"><div class="m" style="color:var(--text-1)">slow</div><div class="v" style="margin-top:6px">320ms</div><div style="font-size:12px;color:var(--text-3);margin-top:4px">dialogs</div></div><div style="padding:14px;border-radius:18px;background:var(--glass-fill);box-shadow:var(--glass-edge);animation:elivo-surface 480ms var(--ease-out) 900ms both infinite alternate"><div class="m" style="color:var(--text-1)">surface</div><div class="v" style="margin-top:6px">480ms</div><div style="font-size:12px;color:var(--text-3);margin-top:4px">card surfaces</div></div></div></body></html>
