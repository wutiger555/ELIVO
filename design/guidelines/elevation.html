<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-3)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-4)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px"><div style="height:90px;border-radius:22px;backdrop-filter:var(--glass-blur);background:var(--glass-fill);box-shadow:var(--glass-edge);display:flex;align-items:flex-end;padding:12px 14px" class="m">glass-edge</div><div style="height:90px;border-radius:22px;backdrop-filter:var(--glass-blur);background:var(--glass-fill-strong);box-shadow:var(--glass-shadow);display:flex;align-items:flex-end;padding:12px 14px" class="m">glass-shadow</div><div style="height:90px;border-radius:22px;backdrop-filter:var(--glass-blur);background:var(--glass-fill-strong);box-shadow:var(--shadow-overlay);display:flex;align-items:flex-end;padding:12px 14px" class="m">overlay</div><div style="height:90px;border-radius:22px;backdrop-filter:var(--glass-blur);background:var(--glass-fill-strong);box-shadow:var(--glow-signal);display:flex;align-items:flex-end;padding:12px 14px" class="m">glow-signal</div></div></body></html>
