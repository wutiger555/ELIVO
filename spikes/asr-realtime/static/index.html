<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELIVO Live</title>
<!-- ELIVO 設計系統：tokens（顏色、字體、間距、玻璃材質、動態） -->
<link rel="stylesheet" href="/design/styles.css">
<style>
  :root {
    --live-size: 30px;
    --history-size: 18px;
    --gutter: 64px;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg-ambient), var(--grid-dot), var(--bg);
    background-size: auto, var(--grid-dot-size), auto;
  }

  /* ---- 標題列 ---- */
  .titlebar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    margin: 12px 12px 0;
    padding: 0 12px 0 20px;
    border-radius: var(--radius-pill);
    background: var(--glass-fill);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
  }
  .wordmark { font: 600 15px/1 var(--font-sans); letter-spacing: .02em; white-space: nowrap; }
  .wordmark span { font-family: var(--font-cjk); font-weight: 400; color: var(--text-3); }
  .source { font: 400 13px/1 var(--font-sans); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .spacer { flex: 1; }
  .stats { font: 400 11.5px/1 var(--font-mono); color: var(--text-3); white-space: nowrap; }
  .stats b { font-weight: 500; color: var(--text-2); }
  .rec {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 14px;
    border-radius: var(--radius-pill);
    background: var(--glass-fill);
    box-shadow: var(--glass-edge);
    font: 500 11px/1 var(--font-mono);
    letter-spacing: var(--tracking-label);
  }
  .rec .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); }
  .rec.on .dot { background: var(--rec); box-shadow: 0 0 10px var(--rec); animation: elivo-pulse 1.6s var(--ease-in-out) infinite; }
  .rec .state { color: var(--text-3); }
  .rec.on .state { color: var(--rec); }
  .rec .clock { color: var(--text-2); letter-spacing: 0; font-variant-numeric: tabular-nums; }

  /* ---- 版面 ---- */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 12px;
    padding: 12px;
  }
  .label {
    display: flex;
    align-items: center;
    gap: 10px;
    font: var(--type-label);
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--text-3);
  }
  .label .meta { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--text-4); font-weight: 400; }

  /* ---- 逐字稿 ---- */
  .conversation { min-height: 0; display: flex; flex-direction: column; padding: 20px 20px 0 28px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--void-4) transparent; }
  #transcript { padding: 16px 8px 40vh 0; }
  .utt {
    display: grid;
    grid-template-columns: var(--gutter) minmax(0, 1fr);
    gap: 16px;
    padding: 10px 0;
    animation: elivo-surface var(--dur-surface) var(--ease-out);
  }
  .gutter { display: flex; flex-direction: column; gap: 6px; padding-top: 7px; }
  .who { font: 500 12.5px/1 var(--font-sans); color: var(--text-2); }
  .who.me { color: var(--accent-text); }
  .tc { font: 400 10.5px/1 var(--font-mono); color: var(--text-4); font-variant-numeric: tabular-nums; }
  .text {
    font-family: var(--font-sans);
    font-size: var(--history-size);
    font-weight: 400;
    line-height: 1.7;
    color: var(--text-2);
    overflow-wrap: anywhere;
    text-wrap: pretty;
    transition: font-size var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out), line-height var(--dur-slow) var(--ease-out);
  }
  /* 正在說的那一句：放大、亮白；定稿後縮回歷史大小 */
  .utt.live .text { font-size: var(--live-size); line-height: 1.45; letter-spacing: -0.01em; color: var(--text-1); }
  .utt.live .gutter { padding-top: 12px; }
  .utt.live .who::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 7px;
    vertical-align: 1px;
    border-radius: 50%;
    background: currentColor;
    animation: elivo-pulse 1.6s var(--ease-in-out) infinite;
  }
  .c { color: inherit; }
  /* 打字機：新確認的字逐字浮現 */
  .ink { display: inline; animation: ink var(--dur-slow) var(--ease-out) both; }
  @keyframes ink { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }
  /* 暫定字：灰色；「還在聽」由行尾的 Ion 游標表示 */
  .t { color: var(--text-4); transition: color var(--dur-base) var(--ease-out); }
  .utt.live .t::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: .9em;
    margin-left: 3px;
    vertical-align: -.1em;
    background: var(--accent);
    animation: elivo-caret 1s steps(1) infinite;
  }
  .rewrite { animation: rewrite var(--dur-slow) var(--ease-out); }
  @keyframes rewrite { from { opacity: .35; filter: blur(3px); } to { opacity: 1; filter: none; } }
  .empty { padding: 40px 0; font: 400 15px/1.6 var(--font-sans); color: var(--text-4); }
  .jump {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(8px);
    opacity: 0;
    pointer-events: none;
    height: 32px;
    padding: 0 14px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--glass-fill-strong);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
    color: var(--text-1);
    font: 500 12.5px/1 var(--font-sans);
    cursor: pointer;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-spring);
  }
  .jump.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .conversation { position: relative; }

  /* ---- Context 面板 ---- */
  .context {
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 20px;
    border-radius: var(--radius-xl);
    background: var(--glass-fill-thin);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-edge);
  }
  #minutes { padding: 16px 0 8px; display: flex; flex-direction: column; gap: 24px; }
  .group-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font: var(--type-label); letter-spacing: var(--tracking-label); color: var(--text-3); }
  .group-title .n { margin-left: auto; color: var(--text-4); font-weight: 400; }
  .items { display: flex; flex-direction: column; gap: 8px; }
  /* 摘要：每次反思整理後更新 */
  .summary { display: flex; flex-direction: column; gap: 14px; }
  .summary.rewrite { animation: rewrite var(--dur-surface) var(--ease-out); }
  .topic-title { font: 500 14px/1.4 var(--font-sans); color: var(--text-1); margin-bottom: 4px; }
  .topic ul { margin: 0; padding-left: 18px; }
  .topic li { font: 400 14px/1.7 var(--font-sans); color: var(--text-2); text-wrap: pretty; }
  .item {
    position: relative;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--glass-fill);
    box-shadow: var(--glass-edge);
    cursor: pointer;
    animation: elivo-surface var(--dur-surface) var(--ease-out);
    transition: background var(--dur-fast) var(--ease-out), opacity var(--dur-slow) var(--ease-out);
  }
  .item:hover { background: rgba(255, 255, 255, .085); }
  .item.fresh { animation: elivo-surface var(--dur-surface) var(--ease-out), fresh 2.6s var(--ease-out); }
  .item.updated { animation: fresh 2.6s var(--ease-out); }
  @keyframes fresh { 0%, 30% { box-shadow: var(--glow-signal); } 100% { box-shadow: var(--glass-edge); } }
  /* 被取代、已回答、完成、取消：退到後面、變淡 */
  .item.inactive { background: var(--glass-fill-thin); opacity: .62; }
  .item.struck .item-text { text-decoration: line-through; text-decoration-color: var(--text-4); color: var(--text-3); }
  .item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .item-id { font: 500 11px/1 var(--font-mono); color: var(--text-4); }
  .badge {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 8px;
    border-radius: var(--radius-pill);
    font: 500 11px/1 var(--font-sans);
    background: var(--surface-hover);
    color: var(--text-2);
  }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .badge.accent { background: var(--accent-soft); color: var(--accent-text); }
  .item-text { font: 500 15px/1.5 var(--font-sans); color: var(--text-1); text-wrap: pretty; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font: 400 13px/1.5 var(--font-sans); color: var(--text-2); }
  .item-meta b { font-weight: 500; color: var(--text-1); }
  .item-change { margin-top: 8px; font: 400 12.5px/1.55 var(--font-sans); color: var(--text-3); text-wrap: pretty; }
  .evidence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tc-chip {
    height: 22px;
    padding: 0 8px;
    border: 0;
    border-radius: var(--radius-pill);
    background: var(--surface-hover);
    color: var(--text-3);
    font: 500 11px/22px var(--font-mono);
    cursor: pointer;
  }
  .tc-chip:hover { color: var(--accent-text); background: var(--accent-soft); }
  .history { display: none; margin: 12px 0 0; padding: 12px 0 0; list-style: none; border-top: 1px solid var(--border); }
  .item.open .history { display: block; }
  .history li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 3px 0; font: 400 12.5px/1.55 var(--font-sans); color: var(--text-3); }
  .history .when { font: 400 11px/1.9 var(--font-mono); color: var(--text-4); }
  .history .by { color: var(--accent-text); }
  .utt.flash { animation: flash 1.6s var(--ease-out); border-radius: var(--radius-sm); }
  @keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  .icon {
    flex: none;
    display: inline-block;
    width: var(--s, 14px);
    height: var(--s, 14px);
    background: currentColor;
    -webkit-mask: var(--i) center / contain no-repeat;
    mask: var(--i) center / contain no-repeat;
  }
  .tone-summary { color: var(--text-2); }
  .tone-decision { color: var(--accent-text); }
  .tone-action { color: var(--text-2); }
  .tone-question { color: var(--info); }
  .tone-number { color: var(--warn); }
  .placeholder { font: 400 14px/1.7 var(--font-sans); color: var(--text-4); padding: 8px 0; }

  @media (max-width: 820px) {
    :root { --live-size: 24px; --history-size: 17px; --gutter: 52px; }
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); }
    .stats { display: none; }
    .conversation { padding: 16px 12px 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="titlebar">
  <div class="wordmark">ELIVO <span>｜意聯</span></div>
  <div class="source" id="source">–</div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <div class="rec" id="rec"><span class="dot"></span><span class="state" id="rec-state">OFFLINE</span><span class="clock" id="clock">00:00:00</span></div>
</header>
<main>
  <section class="conversation">
    <div class="label">Live conversation <span class="meta">繁中 · 中英混說</span></div>
    <div class="scroll" id="scroll">
      <div id="transcript"><div class="empty" id="empty">等待說話…</div></div>
    </div>
    <button class="jump" id="jump" type="button">回到最新</button>
  </section>
  <aside class="context">
    <div class="label">Live minutes <span class="meta" id="minutes-meta"></span></div>
    <div class="scroll">
      <div id="minutes"><div class="placeholder" id="minutes-empty">會中出現的決策、待辦、問題與數字會整理在這裡；結論改變時，記錄會跟著改版，並保留修改紀錄與出處。</div></div>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const scroll = $("scroll"), transcript = $("transcript");
const rows = new Map();          // id → { el, committed }
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON = (name) => `url("https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/${name}.svg")`;
const GROUPS = [
  { kind: "decision", label: "DECISIONS", icon: "milestone", tone: "decision" },
  { kind: "action", label: "ACTION ITEMS", icon: "square-check", tone: "action" },
  { kind: "question", label: "QUESTIONS", icon: "circle-help", tone: "question" },
  { kind: "number", label: "NUMBERS", icon: "hash", tone: "number" },
];
// 各類型「仍有效」的狀態；其他狀態（被取代、已回答、完成…）變淡、排到後面
const ACTIVE = { decision: ["confirmed"], action: ["open"], question: ["open"], number: ["current"] };
const STATUS = {
  superseded: ["已被取代", "warn"], reversed: ["已撤銷", "warn"], answered: ["已回答", "info"], deferred: ["延後", ""],
  done: ["完成", "accent"], cancelled: ["取消", ""],
};
const STRUCK = ["superseded", "reversed", "cancelled"];
let clockBase = 0, clockAt = performance.now(), stick = true;

const pad = (n) => String(Math.floor(n)).padStart(2, "0");
const timecode = (s) => `${pad(s / 3600)}:${pad((s % 3600) / 60)}:${pad(s % 60)}`;

function icon(name, size = 14) {
  const i = document.createElement("span");
  i.className = "icon";
  i.style.setProperty("--i", ICON(name));
  i.style.setProperty("--s", size + "px");
  return i;
}

// ---- 捲動：使用者往上捲時不自動跳到底，改顯示「回到最新」 ----
// 自動捲動會把正在說的那一句停在畫面約 62% 的高度（下方留白），「是否在最新處」也用同一個位置判斷
function followTarget() {
  const last = transcript.lastElementChild;
  if (!last) return 0;
  return Math.max(0, last.offsetTop + last.offsetHeight - scroll.clientHeight * 0.62);
}
let programmatic = false;
scroll.addEventListener("scroll", () => {
  if (programmatic) return;
  stick = scroll.scrollTop >= followTarget() - 150;
  $("jump").classList.toggle("show", !stick);
});
scroll.addEventListener("scrollend", () => { programmatic = false; });
$("jump").onclick = () => { stick = true; $("jump").classList.remove("show"); follow(); };
function follow() {
  const top = followTarget();
  if (Math.abs(scroll.scrollTop - top) < 2) return;
  programmatic = true;
  setTimeout(() => { programmatic = false; }, 800);  // 有些瀏覽器不會送 scrollend，保底解除
  scroll.scrollTo({ top, behavior: reduced ? "auto" : "smooth" });
}

// ---- 逐字稿 ----
function makeRow(ev) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "utt live";
  el.innerHTML = '<div class="gutter"><span class="who"></span><span class="tc"></span></div><div class="text"><span class="c"></span><span class="t"></span></div>';
  const who = el.querySelector(".who");
  who.textContent = ev.speaker;
  if (ev.speaker === "我") who.classList.add("me");
  el.querySelector(".tc").textContent = timecode(ev.t || 0);
  transcript.append(el);
  const row = { el, committed: "" };
  rows.set(ev.id, row);
  return row;
}

function typeIn(container, text) {
  // 逐字浮現；總長度上限約 450ms，長句不會拖太久
  const step = Math.min(22, 450 / Math.max(1, [...text].length));
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = "ink";
    s.textContent = ch;
    s.style.animationDelay = `${Math.round(i * step)}ms`;
    container.append(s);
  });
}

function renderUtt(ev) {
  let row = rows.get(ev.id);
  if (ev.final && !ev.committed) {       // 定稿後是空的（雜訊或幻覺）
    if (row) { row.el.remove(); rows.delete(ev.id); }
    return;
  }
  if (!row) row = makeRow(ev);
  const c = row.el.querySelector(".c"), t = row.el.querySelector(".t");
  if (ev.committed.startsWith(row.committed)) {
    const add = ev.committed.slice(row.committed.length);
    if (add) reduced ? c.append(add) : typeIn(c, add);
  } else {                               // 定稿結果改寫了先前的確定字
    c.textContent = ev.committed;
    c.classList.remove("rewrite"); void c.offsetWidth; c.classList.add("rewrite");
  }
  row.committed = ev.committed;
  t.textContent = ev.tentative;
  if (ev.final) {
    row.el.classList.remove("live");
    // 動畫結束後把逐字 span 合併回純文字，避免 DOM 越長越重
    setTimeout(() => { c.textContent = row.committed; }, 900);
  }
  if (stick) follow();
}

// ---- Live minutes：有版本的會議記錄；改版的項目發光，點出處跳回逐字稿 ----
const itemEls = new Map();   // id → { el, rev }
let uttT = {}, summaryKey = "";

function jumpTo(uttId) {
  const row = rows.get(uttId);
  if (!row) return;
  stick = false;
  $("jump").classList.add("show");
  row.el.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  row.el.classList.remove("flash"); void row.el.offsetWidth; row.el.classList.add("flash");
}

function section(root, key, label, iconName, tone) {
  let sec = root.querySelector(`[data-kind="${key}"]`);
  if (!sec) {
    sec = document.createElement("section");
    sec.dataset.kind = key;
    const title = document.createElement("div");
    title.className = `group-title tone-${tone}`;
    const n = document.createElement("span");
    n.className = "n";
    title.append(icon(iconName, 13), label, n);
    const box = document.createElement("div");
    box.className = key === "summary" ? "summary" : "items";
    sec.append(title, box);
    if (key === "summary") root.prepend(sec); else root.append(sec);
  }
  return sec;
}

function fillItem(el, it) {
  el.replaceChildren();
  const head = document.createElement("div");
  head.className = "item-head";
  const id = document.createElement("span");
  id.className = "item-id";
  id.textContent = it.id;
  head.append(id);
  if (STATUS[it.status]) {
    const b = document.createElement("span");
    b.className = `badge ${STATUS[it.status][1]}`;
    b.textContent = STATUS[it.status][0];
    head.append(b);
  }
  if (it.history.length > 1 && !STATUS[it.status]) {
    const b = document.createElement("span");
    b.className = "badge accent";
    b.textContent = "已更新";
    head.append(b);
  }
  const text = document.createElement("div");
  text.className = "item-text";
  text.textContent = it.kind === "number" && it.value ? `${it.value}　${it.text}` : it.text;
  el.append(head, text);

  const meta = [];
  if (it.owner) meta.push(["負責", it.owner]);
  if (it.due) meta.push(["期限", it.due]);
  if (it.answer) meta.push(["答案", it.answer]);
  if (it.superseded_by) meta.push(["改為", it.superseded_by]);
  if (meta.length) {
    const m = document.createElement("div");
    m.className = "item-meta";
    for (const [k, v] of meta) {
      const span = document.createElement("span");
      span.append(k + " ", Object.assign(document.createElement("b"), { textContent: v }));
      m.append(span);
    }
    el.append(m);
  }
  const last = it.history[it.history.length - 1];
  if (last && it.history.length > 1) {
    const c = document.createElement("div");
    c.className = "item-change";
    c.textContent = `↻ ${timecode(last.t)}　${last.change}`;
    el.append(c);
  }
  const ev = document.createElement("div");
  ev.className = "evidence";
  for (const u of it.utt_ids.slice(0, 4)) {
    if (uttT[u] == null) continue;
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "tc-chip";
    chip.textContent = timecode(uttT[u]);
    chip.title = `跳到 ${u}`;
    chip.onclick = (e) => { e.stopPropagation(); jumpTo(u); };
    ev.append(chip);
  }
  if (ev.childElementCount) el.append(ev);
  const hist = document.createElement("ul");
  hist.className = "history";
  for (const r of it.history) {
    const li = document.createElement("li");
    li.innerHTML = '<span class="when"></span><span><span class="by"></span> <span class="what"></span></span>';
    li.querySelector(".when").textContent = timecode(r.t);
    li.querySelector(".by").textContent = r.by === "reflect" ? "整理" : "即時";
    li.querySelector(".what").textContent = r.change;
    hist.append(li);
  }
  el.append(hist);
  el.classList.toggle("inactive", !ACTIVE[it.kind].includes(it.status));
  el.classList.toggle("struck", STRUCK.includes(it.status));
}

function renderMinutes(m) {
  uttT = m.utt_t || {};
  const items = m.items.filter((it) => it.status !== "retracted");
  $("minutes-empty").hidden = items.length > 0 || m.summary.length > 0;
  const root = $("minutes");
  const meta = [`v${m.version}`];
  if (m.reflected_at != null) meta.push(`整理於 ${timecode(m.reflected_at)}`);
  $("minutes-meta").textContent = meta.join(" · ");

  // 摘要
  const key = JSON.stringify(m.summary);
  if (m.summary.length && key !== summaryKey) {
    const box = section(root, "summary", "SUMMARY", "file-text", "summary").querySelector(".summary");
    box.replaceChildren(...m.summary.map((t) => {
      const d = document.createElement("div");
      d.className = "topic";
      const h = document.createElement("div");
      h.className = "topic-title";
      h.textContent = t.topic;
      const ul = document.createElement("ul");
      ul.append(...t.points.map((pt) => Object.assign(document.createElement("li"), { textContent: pt })));
      d.append(h, ul);
      return d;
    }));
    box.classList.remove("rewrite"); void box.offsetWidth; box.classList.add("rewrite");
    summaryKey = key;
  }

  const seen = new Set();
  for (const g of GROUPS) {
    const list = items.filter((it) => it.kind === g.kind);
    if (!list.length) { root.querySelector(`[data-kind="${g.kind}"]`)?.remove(); continue; }
    const sec = section(root, g.kind, g.label, g.icon, g.tone);
    sec.querySelector(".n").textContent = list.filter((it) => ACTIVE[g.kind].includes(it.status)).length;
    const box = sec.querySelector(".items");
    // 仍有效的在前，其餘依編號
    list.sort((a, b) => (ACTIVE[g.kind].includes(b.status) - ACTIVE[g.kind].includes(a.status)) || a.id.localeCompare(b.id, "en", { numeric: true }));
    for (const it of list) {
      seen.add(it.id);
      let rec = itemEls.get(it.id);
      if (!rec) {
        const el = document.createElement("div");
        el.className = "item fresh";
        el.onclick = () => el.classList.toggle("open");
        rec = { el, rev: 0 };
        itemEls.set(it.id, rec);
      } else if (it.history.length > rec.rev) {
        rec.el.classList.remove("fresh", "updated"); void rec.el.offsetWidth; rec.el.classList.add("updated");
      }
      if (it.history.length !== rec.rev) { fillItem(rec.el, it); rec.rev = it.history.length; }
      box.append(rec.el);   // 依排序重新排列（已在的元素會被移動，不會重建）
    }
  }
  for (const [id, rec] of itemEls) {
    if (!seen.has(id)) { rec.el.remove(); itemEls.delete(id); }
  }
}

function renderStats(s) {
  if (!s) return;
  const f = (v) => (v == null ? "–" : v.toFixed(1) + "s");
  $("stats").innerHTML = `首字 <b>${f(s.first_p50)}</b> · 定稿 <b>${f(s.final_p50)}</b> · 推論 <b>${f(s.infer_p50)}</b> · <b>${s.utterances}</b> 句`;
}

setInterval(() => { $("clock").textContent = timecode(clockBase + (performance.now() - clockAt) / 1000); }, 500);

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("rec").classList.add("on"); $("rec-state").textContent = "REC"; };
  ws.onclose = () => { $("rec").classList.remove("on"); $("rec-state").textContent = "OFFLINE"; setTimeout(connect, 1000); };
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "snapshot") {
      rows.forEach((r) => r.el.remove()); rows.clear();
      ev.utts.forEach(renderUtt);
      clockBase = ev.status.elapsed || 0; clockAt = performance.now();
      $("source").textContent = `${ev.status.source} · ${ev.status.model}`;
      renderStats(ev.status.stats);
      if (ev.status.minutes) renderMinutes(ev.status.minutes);
    } else if (ev.type === "utt") renderUtt(ev);
    else if (ev.type === "stats") renderStats(ev.stats);
    else if (ev.type === "minutes") renderMinutes(ev.minutes);
  };
}
connect();
</script>
</body>
</html>
